<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qual iPhone é pra você?</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c26;
    --border: rgba(255,255,255,0.07);
    --accent: #c8f0ff;
    --accent2: #7dd3f8;
    --accent3: #ffd6a5;
    --text: #f0f0f5;
    --muted: #7a7a90;
    --radius: 18px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
  body::before { content:''; position:fixed; inset:0; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E"); pointer-events:none; z-index:0; }
  .glow-orb { position:fixed; border-radius:50%; filter:blur(120px); pointer-events:none; z-index:0; opacity:0.15; }
  .glow-orb.one { width:600px; height:600px; background:#1a6fff; top:-200px; right:-100px; }
  .glow-orb.two { width:400px; height:400px; background:#7b2fff; bottom:-100px; left:-100px; }
  .app { position:relative; z-index:1; max-width:680px; margin:0 auto; padding:48px 24px 80px; min-height:100vh; display:flex; flex-direction:column; }
  .header { text-align:center; margin-bottom:52px; animation:fadeUp 0.6s ease both; }
  .logo-badge { display:inline-flex; align-items:center; gap:8px; background:rgba(200,240,255,0.07); border:1px solid rgba(200,240,255,0.15); border-radius:100px; padding:6px 16px; font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent2); margin-bottom:28px; font-weight:500; }
  h1 { font-family:'Playfair Display',serif; font-size:clamp(36px,7vw,56px); font-weight:900; line-height:1.05; letter-spacing:-0.02em; margin-bottom:16px; }
  h1 em { font-style:normal; background:linear-gradient(135deg,var(--accent),var(--accent2),#a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  .subtitle { color:var(--muted); font-size:16px; line-height:1.6; max-width:440px; margin:0 auto; font-weight:300; }
  .progress-wrap { margin-bottom:36px; animation:fadeUp 0.6s 0.1s ease both; }
  .progress-meta { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:10px; font-weight:500; letter-spacing:0.04em; }
  .progress-track { height:3px; background:var(--surface2); border-radius:100px; overflow:hidden; }
  .progress-fill { height:100%; background:linear-gradient(90deg,var(--accent2),#a78bfa); border-radius:100px; transition:width 0.5s cubic-bezier(0.34,1.56,0.64,1); }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:36px; margin-bottom:16px; animation:fadeUp 0.5s ease both; position:relative; overflow:hidden; }
  .card::before { content:''; position:absolute; top:0; left:0; right:0; height:1px; background:linear-gradient(90deg,transparent,rgba(200,240,255,0.2),transparent); }
  .question-num { font-size:11px; letter-spacing:0.15em; text-transform:uppercase; color:var(--accent2); font-weight:600; margin-bottom:14px; }
  .question-text { font-family:'Playfair Display',serif; font-size:clamp(20px,4vw,26px); font-weight:700; line-height:1.3; margin-bottom:28px; letter-spacing:-0.01em; }
  .question-icon { font-size:32px; margin-bottom:12px; display:block; }
  .options { display:flex; flex-direction:column; gap:10px; }
  .option { display:flex; align-items:flex-start; gap:14px; padding:16px 18px; background:var(--surface2); border:1.5px solid var(--border); border-radius:12px; cursor:pointer; transition:all 0.2s ease; text-align:left; width:100%; position:relative; overflow:hidden; }
  .option:hover { border-color:rgba(125,211,248,0.3); background:rgba(125,211,248,0.05); transform:translateX(3px); }
  .option.selected { border-color:var(--accent2); background:rgba(125,211,248,0.08); }
  .option.selected::after { content:'✓'; position:absolute; right:16px; top:50%; transform:translateY(-50%); width:22px; height:22px; background:var(--accent2); color:var(--bg); border-radius:50%; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .option-icon { font-size:22px; flex-shrink:0; margin-top:1px; }
  .option-label { font-size:15px; font-weight:500; color:var(--text); line-height:1.3; margin-bottom:3px; }
  .option-desc { font-size:13px; color:var(--muted); font-weight:300; line-height:1.4; }
  .actions { display:flex; gap:12px; margin-top:8px; animation:fadeUp 0.5s 0.1s ease both; }
  .btn { font-family:'DM Sans',sans-serif; font-size:15px; font-weight:600; border:none; border-radius:12px; padding:15px 28px; cursor:pointer; transition:all 0.2s ease; letter-spacing:0.02em; }
  .btn-primary { background:linear-gradient(135deg,var(--accent2),#a78bfa); color:#000; flex:1; }
  .btn-primary:hover { transform:translateY(-2px); box-shadow:0 12px 40px rgba(125,211,248,0.25); }
  .btn-primary:disabled { opacity:0.4; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn-ghost { background:transparent; border:1.5px solid var(--border); color:var(--muted); padding:15px 20px; }
  .btn-ghost:hover { border-color:rgba(255,255,255,0.2); color:var(--text); }
  .result-screen { animation:fadeUp 0.7s ease both; }
  .result-hero { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:40px 36px; margin-bottom:20px; text-align:center; position:relative; overflow:hidden; }
  .result-hero::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 50% 0%,rgba(125,211,248,0.08) 0%,transparent 70%); }
  .result-img { width:160px; height:160px; object-fit:cover; margin:0 auto 16px; display:block; border-radius:16px; }
  .result-img-placeholder { width:100px; height:100px; margin:0 auto 16px; font-size:72px; line-height:1; display:flex; align-items:center; justify-content:center; animation:bounce 0.6s ease both; }
  .result-tag { display:inline-block; background:rgba(200,240,255,0.08); border:1px solid rgba(200,240,255,0.15); border-radius:100px; padding:5px 14px; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent2); font-weight:600; margin-bottom:16px; }
  .result-model { font-family:'Playfair Display',serif; font-size:clamp(24px,5vw,40px); font-weight:900; letter-spacing:-0.02em; margin-bottom:6px; line-height:1.1; }
  .result-model span { background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  .result-price { font-size:14px; font-weight:600; color:var(--accent3); margin-bottom:14px; }
  .result-desc { font-size:15px; color:var(--muted); line-height:1.65; max-width:480px; margin:0 auto 4px; font-weight:300; }
  .specs-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:20px; }
  @media(max-width:500px){.specs-grid{grid-template-columns:1fr;}}
  .spec-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px; }
  .spec-card h4 { font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); font-weight:600; margin-bottom:12px; }
  .spec-list { list-style:none; display:flex; flex-direction:column; gap:8px; }
  .spec-list li { font-size:13px; color:var(--text); font-weight:400; display:flex; align-items:flex-start; gap:8px; line-height:1.4; }
  .spec-list li::before { content:attr(data-icon); flex-shrink:0; font-size:14px; }
  .source-badge { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; background:rgba(125,211,248,0.08); border:1px solid rgba(125,211,248,0.15); border-radius:100px; font-size:11px; color:var(--accent2); margin-bottom:20px; }
  .btn-restart { width:100%; background:transparent; border:1.5px solid var(--border); color:var(--muted); border-radius:12px; padding:15px; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; cursor:pointer; transition:all 0.2s; margin-top:8px; }
  .btn-restart:hover { border-color:rgba(255,255,255,0.2); color:var(--text); }
  @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
  @keyframes bounce { 0%{transform:scale(0.5);opacity:0} 70%{transform:scale(1.1)} 100%{transform:scale(1);opacity:1} }
  .slide-in { animation:fadeUp 0.4s ease both; }
  @media(max-width:480px){.app{padding:32px 16px 60px;} .card{padding:24px;} .result-hero{padding:32px 24px;}}
</style>
</head>
<body>
<div class="glow-orb one"></div>
<div class="glow-orb two"></div>
<div class="app" id="app">
  <div class="header" id="intro-header">
    <div class="logo-badge"><span>🍎</span> Guia iPhone</div>
    <h1>Qual iPhone é<br><em>realmente</em> pra você?</h1>
    <p class="subtitle">Comece pelo orçamento e responda mais uma pergunta rápida — a gente te diz exatamente qual modelo (ou se nem precisa ser um iPhone) combina com você.</p>
  </div>
  <div class="progress-wrap" id="progress-section" style="display:none">
    <div class="progress-meta">
      <span id="progress-label">Pergunta 1 de 2</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>
  <div id="question-area"></div>
  <div class="actions" id="actions-area" style="display:none">
    <button class="btn btn-ghost" id="btn-back" onclick="goBack()">← Voltar</button>
    <button class="btn btn-primary" id="btn-next" onclick="goNext()" disabled>Continuar →</button>
  </div>
</div>

<script>
// ─── Perguntas (a árvore original, com o orçamento filtrando o caminho) ─────
const QUESTIONS = {
  budget: {
    icon:'💰', text:'Qual é o seu orçamento aproximado?',
    options:[
      {icon:'🍏', label:'Até R$ 2.800',            desc:'Quero gastar o mínimo possível',                    next:'result:budgetApple'},
      {icon:'🟢', label:'R$ 2.800 a R$ 4.500',      desc:'Bom custo-benefício, sem exagerar',                 next:'entry'},
      {icon:'🟡', label:'R$ 4.500 a R$ 6.000',      desc:'Posso investir um pouco mais',                      next:'wide'},
      {icon:'🔵', label:'Acima de R$ 6.000',        desc:'Quero o topo de linha',                             next:'size'},
    ]
  },
  entry: {
    icon:'⚖️', text:'Prefere um iPhone novo e mais simples, ou um usado com mais recursos (mesmo sem os lançamentos mais recentes de IA)?',
    options:[
      {icon:'✨', label:'Novo e simples',        desc:'Câmera boa já resolve, e eu economizo o resto',        next:'result:e'},
      {icon:'♻️', label:'Usado, mais completo',  desc:'Não ligo pra Apple Intelligence nem pra entrada Lightning', next:'result:iphone15'},
    ]
  },
  wide: {
    icon:'🌄', text:'Você sabe o que é uma câmera ultra grande angular (pra fotos bem abertas, tipo paisagens) e pretende usar isso com frequência?',
    options:[
      {icon:'📷', label:'Uso com frequência',     desc:'Quero esse recurso no dia a dia',                     next:'result:base'},
      {icon:'💸', label:'Prefiro economizar',     desc:'Uma câmera boa já me atende',                         next:'result:e'},
      {icon:'📸', label:'Quero o máximo de câmeras possível', desc:'Mesmo que seja um modelo mais antigo, não ligo se esquentar', next:'result:iphone15pro'},
    ]
  },
  size: {
    icon:'📐', text:'Prefere uma tela e uma bateria maiores, ou um tamanho mais compacto?',
    options:[
      {icon:'🔭', label:'Maior, quero tudo grande', desc:'Tela e bateria no talo',                             next:'result:proMax'},
      {icon:'📱', label:'Mais compacto',            desc:'Topo de linha, só que cabendo no bolso',              next:'result:pro'},
    ]
  }
};

// ─── Resultados ───────────────────────────────────────────────
const RESULTS = {
  proMax: {
    tag:"Caro e Grande", name:"iPhone Pro Max (16/17)", price:"Acima de R$ 7.000",
    desc:"Você quer a câmera com zoom de longa distância E uma tela e bateria enormes. Parabéns, seu bolso vai sentir — mas sua galeria de fotos vai agradecer.",
    img:"https://http2.mlstatic.com/D_NQ_NP_870044-MLA108812169320_032026-B.jpg",
    pros:["Zoom óptico de longa distância","Tela e bateria gigantes","O topo de linha absoluto"],
    cons:["O mais caro da linha","Grande e pesado no bolso"]
  },
  pro: {
    tag:"Caro e Pequeno", name:"iPhone Pro (16/17)", price:"Acima de R$ 6.000",
    desc:"Zoom de longa distância? Sim. Tela e bateria XL? Não precisa. Você quer o topo de linha só que num tamanho que caiba no bolso da calça.",
    img:"https://www.content.shi.com/cms-content/accelerator/media/brands/apple/iphone/iphone-17-pro-max/unibody-small.png",
    pros:["Mesmo sistema de câmeras do Pro Max","Tamanho mais compacto","Ainda assim, topo de linha"],
    cons:["Bateria menor que a do Max","Preço ainda salgado"]
  },
  base: {
    tag:"Intermediário", name:"iPhone (16/17)", price:"R$ 4.500 – R$ 5.500",
    desc:"Nada de zoom exagerado, mas você manja de câmera ultra grande angular e usa ela de verdade. Atualizações de software por anos e uma bateria que não te abandona.",
    img:"https://http2.mlstatic.com/D_NQ_NP_681942-MLA109633991465_032026-B.jpg",
    pros:["Câmera ultra grande angular","Anos de atualização de software","Boa autonomia de bateria"],
    cons:["Sem zoom de longa distância","Câmera única principal"]
  },
  e: {
    tag:"Custo-Benefício", name:"iPhone E (16/17)", price:"R$ 2.800 – R$ 4.500",
    desc:"Uma câmera boa já resolve sua vida e você prefere economizar o resto. Esperto — é o iPhone que faz tudo sem pesar tanto no cartão.",
    img:"https://www.apple.com/id/home/images/heroes/iphone-17e/hero_iphone_17e_announce__e1ip5db56t4y_large.jpg",
    pros:["Melhor custo-benefício da linha atual","Entrada USB-C","Compatível com Apple Intelligence"],
    cons:["Sem câmera ultra grande angular","Menos recursos de câmera no geral"]
  },
  iphone15: {
    tag:"Exceção · Usado", name:"iPhone 15 (normal)", price:"Usado / seminovo",
    desc:"Apple Intelligence não é sua prioridade e entrada Lightning não te assusta. Um clássico ainda muito competente pra quem quer economizar de verdade.",
    img:"https://http2.mlstatic.com/D_NQ_NP_779617-MLA71782867320_092023-F.jpg",
    pros:["Preço de usado bem mais baixo","Dynamic Island","Ainda roda tudo bem"],
    cons:["Entrada Lightning, não USB-C","Sem Apple Intelligence"]
  },
  iphone15pro: {
    tag:"Exceção · Usado", name:"iPhone 15 Pro / Pro Max", price:"Usado / seminovo",
    desc:"Você quer o máximo de câmeras possível e não liga nem um pouco se o aparelho esquentar no jogo pesado. Respeito.",
    img:"https://http2.mlstatic.com/D_NQ_NP_924631-MLA71783367058_092023-F.jpg",
    pros:["Sistema de câmeras completo","Preço de usado mais acessível que o Pro novo","Corpo em titânio"],
    cons:["Esquenta mais em uso pesado","Sem os recursos mais recentes de IA"]
  },
  budgetApple: {
    tag:"Custo Mínimo", name:"O iPhone mais recente que couber no bolso", price:"Até R$ 2.800",
    desc:"Com esse orçamento, esquece os modelos novos. Pegue o iPhone usado ou seminovo menos velho que você conseguir pagar — sem crise de consciência.",
    img:"https://http2.mlstatic.com/D_NQ_NP_779617-MLA71782867320_092023-F.jpg",
    pros:["Continua no ecossistema Apple","Melhor preço possível dentro da marca"],
    cons:["Modelo mais antigo","Vida útil de atualizações mais curta"]
  },
};

// ─── State ────────────────────────────────────────────────────
let currentId = 'budget';
let history = [];
let selectedNext = null;

function renderIntro() {
  document.getElementById('question-area').innerHTML = `
    <div class="card slide-in" style="text-align:center">
      <p style="color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:24px;font-weight:300;">
        Só <strong style="color:var(--text)">1 ou 2 perguntas rápidas</strong>: quanto você quer investir e, dependendo da faixa, o que mais importa pra você. Sem tecniquês, sem enrolação.
      </p>
      <button class="btn btn-primary" style="width:100%;font-size:16px;padding:18px" onclick="startQuiz()">
        Começar agora →
      </button>
    </div>`;
  document.getElementById('actions-area').style.display = 'none';
  document.getElementById('progress-section').style.display = 'none';
}

function startQuiz() {
  currentId = 'budget';
  history = [];
  document.getElementById('progress-section').style.display = 'block';
  document.getElementById('actions-area').style.display = 'flex';
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[currentId];
  const step = history.length + 1; // 1 or 2
  selectedNext = null;
  const pct = Math.round(((step-1) / 2) * 100);
  document.getElementById('progress-label').textContent = `Pergunta ${step} de 2`;
  document.getElementById('progress-pct').textContent = `${pct}%`;
  document.getElementById('progress-fill').style.width = `${pct}%`;
  document.getElementById('btn-back').style.display = history.length === 0 ? 'none' : 'block';
  document.getElementById('btn-next').disabled = true;

  document.getElementById('question-area').innerHTML = `
    <div class="card slide-in">
      <span class="question-num">Pergunta ${step}</span>
      <span class="question-icon">${q.icon}</span>
      <div class="question-text">${q.text}</div>
      <div class="options">
        ${q.options.map((opt,i)=>`
          <button class="option" data-idx="${i}" onclick="selectOption(${i})">
            <span class="option-icon">${opt.icon}</span>
            <div class="option-content">
              <div class="option-label">${opt.label}</div>
              <div class="option-desc">${opt.desc}</div>
            </div>
          </button>`).join('')}
      </div>
    </div>`;
}

function selectOption(idx) {
  const q = QUESTIONS[currentId];
  selectedNext = q.options[idx].next;
  document.querySelectorAll('.option').forEach((el,i)=>{
    el.classList.toggle('selected', i === idx);
  });
  document.getElementById('btn-next').disabled = false;
}

function goNext() {
  if (!selectedNext) return;
  if (selectedNext.startsWith('result:')) {
    showResult(selectedNext.replace('result:',''));
  } else {
    history.push(currentId);
    currentId = selectedNext;
    renderQuestion();
  }
}

function goBack() {
  if (history.length > 0) {
    currentId = history.pop();
    renderQuestion();
  }
}

function showResult(key) {
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('progress-pct').textContent = '100%';
  document.getElementById('progress-label').textContent = 'Resultado';
  document.getElementById('actions-area').style.display = 'none';
  document.getElementById('intro-header').style.display = 'none';

  const r = RESULTS[key];
  const imgHtml = `<img src="${r.img}" alt="${r.name}" class="result-img" onerror="this.outerHTML='&lt;div class=\\'result-img-placeholder\\'&gt;📱&lt;/div&gt;'">`;
  const prosHtml = r.pros.map(p=>`<li data-icon="→">${p}</li>`).join('');
  const consHtml = r.cons.map(c=>`<li data-icon="·">${c}</li>`).join('');

  document.getElementById('question-area').innerHTML = `
    <div class="result-screen">
      <div style="text-align:center"><span class="source-badge">✦ Sua recomendação</span></div>
      <div class="result-hero">
        ${imgHtml}
        <div class="result-tag">${r.tag}</div>
        <div class="result-model"><span>${r.name}</span></div>
        <div class="result-price">${r.price}</div>
        <p class="result-desc">${r.desc}</p>
      </div>
      <div class="specs-grid">
        <div class="spec-card">
          <h4>✅ Pontos fortes</h4>
          <ul class="spec-list">${prosHtml}</ul>
        </div>
        <div class="spec-card">
          <h4>⚠️ Limitações</h4>
          <ul class="spec-list">${consHtml}</ul>
        </div>
      </div>
      <button class="btn-restart" onclick="restartQuiz()">↺ Refazer o questionário</button>
    </div>`;
}

function restartQuiz() {
  currentId = 'budget'; history = []; selectedNext = null;
  document.getElementById('intro-header').style.display = 'block';
  document.getElementById('progress-fill').style.width = '0%';
  renderIntro();
}

renderIntro();
</script>
</body>
</html>
